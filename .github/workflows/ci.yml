name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # Imutáveis: pin por commit SHA (tightening do cicd-framework §4.1; ver AGENTS.md §8); tags vN são mutáveis.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # packageManager (pnpm@10.34.9) em package.json tem precedência — sem input "version"
      - uses: pnpm/action-setup@f53f5227a9e83886ab598c617f3c170fab62f0d3 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # extensão deste repo (ver AGENTS.md §6): valida os datasets antes de o resultado ser publicável
      - run: pnpm check:data
      # M12: data/recipes.json é gerado a partir de data/recipes/ — a CI falha se divergirem
      - run: pnpm data:build --check
